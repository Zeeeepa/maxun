# SECURE CREDENTIALS FILE
# ⚠️ NEVER COMMIT THIS FILE TO GIT ⚠️
# Add to .gitignore immediately

platforms:
  discord:
    username: "your_discord_email@example.com"
    password: "your_discord_password"
    server_id: "YOUR_SERVER_ID"
    channel_id: "YOUR_CHANNEL_ID"
  
  slack:
    username: "your_slack_email@example.com"
    password: "your_slack_password"
    workspace_id: "YOUR_WORKSPACE_ID"
    channel_id: "YOUR_CHANNEL_ID"
  
  teams:
    username: "your_teams_email@example.com"
    password: "your_teams_password"
    team_id: "YOUR_TEAM_ID"
    channel_id: "YOUR_CHANNEL_ID"
  
  whatsapp:
    # WhatsApp Web uses QR code - credentials for session persistence
    session_file: "/path/to/whatsapp_session.json"
    phone_number: "+1234567890"
  
  telegram:
    phone_number: "+1234567890"
    # Telegram uses verification code
    api_id: "YOUR_API_ID"
    api_hash: "YOUR_API_HASH"
  
  custom:
    username: "your_custom_email@example.com"
    password: "your_custom_password"
    base_url: "https://your-chat-platform.com"

# OpenAI API Configuration
openai_api:
  enabled: true
  compatibility_mode: true
  base_url: "http://localhost:8080/v1"
